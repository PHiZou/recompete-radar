version: 2

models:
  - name: mart_awards
    description: >
      Award-grain rollup of USASpending transaction data. One row per
      `award_unique_key`. Total obligated is the sum across all mods; the
      classification and agency fields take the most recent non-null value.
    tests:
      # A task order's PIID is only unique inside its parent IDV, so the
      # business key is (parent_piid, piid), never piid alone.
      # Fails as of 2026-09-27: 3 pairs from 2004-05 Coast Guard orders appear twice,
      # once under DOT agency id 6950 and once under DHS 7008.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [parent_piid, piid]
    columns:
      - name: award_unique_key
        description: Stable award identifier.
        tests:
          - unique
          - not_null
      - name: total_obligated
        description: Sum of federal action obligations across all mods.
        tests:
          - not_null
      - name: pop_current_end_date
        description: Most recent period-of-performance end date — drives recompete timing.

  - name: mart_recompete_candidates
    description: >
      Active awards (POP end -3..+36 months) scored with the backtested
      scorecards in seeds/score_weights.csv. See the model header.
    tests:
      # What /contracts/{piid}?parent_piid=... relies on: one candidate per
      # (parent_piid, piid). piid alone repeats (e.g. 75FCMC22F0001 x 11).
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [parent_piid, piid]
    columns:
      - name: award_unique_key
        tests:
          - unique
          - not_null
      - name: incumbent_strength
        description: 100 * P(incumbent wins the follow-on).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: recompete_score
        description: 100 * P(follow-on) * (1 - P(incumbent wins)).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
